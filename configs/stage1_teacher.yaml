project:
  name: wavelet_open_set_deepfake_detection
  seed: 42
  output_dir: outputs/stage1_teacher

task:
  num_known_classes: 2
  known_class_names: [real, fake]
  output_names: [real, fake, unknown]
  fake_subclass_names: [face_swap, attribute_edit]

data:
  # Reorganized from D:/dataset without modifying the raw source datasets.
  root: /mnt/d/dataset/wavelet_reorganized_v1
  image_size: 224
  batch_size: 16
  num_workers: 4
  pin_memory: true
  allowed_extensions: [.jpg, .jpeg, .png, .bmp, .webp]
  face_preprocessing:
    # Face crops are materialized once by preprocess_dataset_faces.py.
    enabled: false
    strategy: face_or_center
    margin_ratio: 0.35
    min_face_ratio: 0.08
    scale_factor: 1.1
    min_neighbors: 5
  sampling:
    mode: hierarchical_balanced
    real_fraction: 0.5

wavelet:
  name: haar
  mode: periodization
  level: 2

model:
  backbone: resnet18
  pretrained: true
  embedding_dim: 256
  dropout: 0.2

augmentation:
  rgb_local_mask_probability: 0.5
  rgb_local_mask_ratio: 0.25
  wavelet_local_mask_probability: 0.5
  wavelet_local_mask_ratio: 0.25
  high_subband_drop_probability: 0.15
  degradation_probability: 0.5
  degradation:
    jpeg_quality_range: [45, 95]
    blur_sigma_range: [0.1, 1.5]
    noise_std_range: [0.0, 0.03]
    resize_scale_range: [0.6, 1.0]

loss:
  rgb_aux_weight: 0.3
  high_aux_weight: 0.3
  low_aux_weight: 0.1
  robustness_weight: 0.2
  feature_consistency_weight: 0.1
  degraded_classification_weight: 0.0

training:
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001
  device: auto
  checkpoint_path: outputs/stage1_teacher/best_teacher.pth
